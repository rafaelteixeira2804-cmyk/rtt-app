<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RunThisTown</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RunThisTown">
<meta name="application-name" content="RunThisTown">
<meta name="theme-color" content="#131317">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app escuro em camadas (cinza-grafite, não preto puro). Cada área tem uma cor-guia: Hoje laranja, Plano dourado, Água ciano, Força violeta, Sono anil; tipos de treino com cor própria e rótulo */
:root{
  color-scheme:dark;
  --bg:#131317; --s1:#1a1a20; --s2:#22222a; --s3:#2b2b34;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --ink:#f2f2f5; --ink-2:#b8b8c4; --ink-3:#9494a1;
  --ember:#ff8f66; --ember-d:#ff6b3d; --mint:#5fe3b4; --blue:#86b6ff; --violet:#b8a2ff; --cyan:#62d3f7; --gold:#f4cb6e; --indigo:#9aa4ff; --rest:#8b8b98; --warn:#ff8f66;
  --f:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:20px;
  --sec:var(--ember); --sec-rgb:255,143,102;
}
body[data-sec="plano"],body[data-sec="planos"]{--sec:var(--gold);--sec-rgb:244,203,110}
body[data-sec="agua"]{--sec:var(--cyan);--sec-rgb:98,211,247}
body[data-sec="forca"]{--sec:var(--violet);--sec-rgb:184,162,255}
body[data-sec="ritmos"],body[data-sec="resumo"]{--sec:var(--blue);--sec-rgb:134,182,255}
body[data-sec="vo2max"]{--sec:var(--ember);--sec-rgb:255,143,102}
body[data-sec="ciencia"]{--sec:var(--gold);--sec-rgb:244,203,110}
body[data-sec="mais"]{--sec:var(--ink-2);--sec-rgb:184,184,196}
.c-ember{--c:var(--ember);--rgb:255,143,102}.c-mint{--c:var(--mint);--rgb:95,227,180}.c-blue{--c:var(--blue);--rgb:134,182,255}.c-violet{--c:var(--violet);--rgb:184,162,255}.c-cyan{--c:var(--cyan);--rgb:98,211,247}.c-gold{--c:var(--gold);--rgb:244,203,110}.c-indigo{--c:var(--indigo);--rgb:154,164,255}.c-grey{--c:var(--rest);--rgb:139,139,152}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.02em}
p{margin:0}
a{color:var(--sec);text-decoration:none}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .12s ease,background .15s,border-color .15s,color .15s,box-shadow .15s}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--sec);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--ink-3);font-size:13px}
.panel{display:grid;gap:12px;padding-block:6px 32px}
.view{animation:in .24s ease both}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;padding-inline:2px}
.sec-h h2{font-size:18px}
.lead{color:var(--ink-2);max-width:60ch;font-size:15px}
.back{appearance:none;border:0;background:none;padding:2px 0;color:var(--sec);font-weight:500;font-size:14px;cursor:pointer;justify-self:start}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.overlap{margin-top:0}

/* ---------- superfícies em camadas ---------- */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 1px 2px rgba(0,0,0,.3)}
.tint{background:linear-gradient(180deg,rgba(var(--rgb),.13),rgba(var(--rgb),.03) 55%,rgba(var(--rgb),0)),var(--s1);border-color:rgba(var(--rgb),.22)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.card-h h3{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.tint .card-h h3{color:var(--c)}
.tint .card-h h3::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--c)}
.linkbtn{appearance:none;border:0;background:none;padding:0;color:var(--ink-2);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap}
.tint .linkbtn{color:var(--c)}
.btn{appearance:none;border:1px solid var(--line-2);background:var(--s2);color:var(--ink);border-radius:12px;padding:9px 14px;font-weight:500;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.3;cursor:default}
.btn.primary{background:linear-gradient(135deg,#ff7a4a,#ffac5f);border:0;color:#1b0c05;font-weight:600;box-shadow:0 8px 24px rgba(255,122,74,.28)}
.btn.block{width:100%;padding:14px 16px;font-size:15px}

/* ---------- topo ---------- */
.top{position:relative;background:radial-gradient(520px 180px at 12% -40px,rgba(var(--sec-rgb),.16),transparent 70%);transition:background .3s}
.top-in{padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:16px;display:grid;gap:16px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:-.02em}
.logo .mark{width:30px;height:24px;flex:0 0 auto}
.pro{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;color:#1c1405;background:linear-gradient(135deg,#f6d27c,#d9a94a);padding:2px 6px;border-radius:5px}
.save{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);white-space:nowrap}
.save i{width:6px;height:6px;border-radius:50%;background:var(--rest)}
.save[data-s="cloud"] i{background:var(--mint);box-shadow:0 0 6px var(--mint)}
.save[data-s="saving"] i{background:var(--gold)}
.save[data-s="err"] i,.save[data-s="ro"] i{background:var(--warn)}
.daynav{display:flex;align-items:center;gap:8px}
.daynav h1{flex:1;font-size:clamp(28px,7.5vw,34px);line-height:1.05}
.daynav h1 small{display:block;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sec);margin-bottom:6px}
.arrow{appearance:none;width:38px;height:38px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line-2);background:var(--s1);color:var(--ink-2);font-size:18px;line-height:1;cursor:pointer}
.arrow:hover{color:var(--ink)}
.top-sub{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.chipx{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:var(--s1);border:1px solid var(--line-2);font-size:12px;font-weight:500;color:var(--ink-2)}
.chipx b{color:var(--sec);font-family:var(--mono);font-weight:600}
.chipx.go{cursor:pointer;background:rgba(var(--sec-rgb),.16);border-color:rgba(var(--sec-rgb),.4);color:var(--sec)}

/* ---------- anéis ---------- */
.rings{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.rsvg{width:118px;height:118px;position:relative}
.rsvg svg{width:100%;height:100%;transform:rotate(-90deg)}
.rsvg circle{fill:none;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.rsvg .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rsvg .c b{font-family:var(--mono);font-weight:600;font-size:22px;line-height:1;letter-spacing:-.04em}
.rsvg .c span{font-size:10px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.rleg{display:grid;gap:8px}
.rl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;color:var(--ink-2);padding:6px 10px;border-radius:12px;background:rgba(var(--rgb),.08)}
.rl i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px rgba(var(--rgb),.6)}
.rl b{font-family:var(--mono);font-weight:500;color:var(--c);font-size:13px}
.rl.na{background:var(--s2)}
.rl.na i{background:var(--rest);box-shadow:none}
.rl.na b{color:var(--ink-3)}
.rings.done .rsvg{filter:drop-shadow(0 0 12px rgba(255,143,102,.35))}

/* ---------- coach ---------- */
.coach{display:grid;gap:8px}
.ins{padding:10px 12px;border-radius:12px;background:var(--s2);border-left:3px solid var(--rest)}
.ins.warn{border-left-color:var(--ember);background:rgba(255,143,102,.08)}
.ins.ok{border-left-color:var(--mint);background:rgba(95,227,180,.07)}
.ins.info{border-left-color:var(--blue);background:rgba(134,182,255,.07)}
.ins b{display:block;font-size:15px;font-weight:600}
.ins p{font-size:14px;color:var(--ink-2);margin-top:2px}
.ref{appearance:none;border:1px solid rgba(244,203,110,.35);background:rgba(244,203,110,.08);color:var(--gold);font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:6px;cursor:pointer;margin-top:7px;margin-right:6px}
.ref:hover{background:rgba(244,203,110,.16)}

/* ---------- treino ---------- */
.tcard{display:grid;gap:12px}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--c,var(--rest));background:rgba(var(--rgb,139,139,152),.13);padding:3px 9px;border-radius:99px;justify-self:start}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-facil{--c:var(--mint);--rgb:95,227,180}.p-longao{--c:var(--blue);--rgb:134,182,255}.p-qual{--c:var(--ember);--rgb:255,143,102}.p-forca{--c:var(--violet);--rgb:184,162,255}.p-desc{--c:var(--rest);--rgb:139,139,152}.p-ativ{--c:var(--ember);--rgb:255,143,102}.p-prova{--c:var(--gold);--rgb:244,203,110}
.day-head{display:grid;gap:6px}
.day-head h4{font-size:20px}
.day-head h4 small{font-size:15px;font-weight:400;color:var(--ink-2);letter-spacing:-.01em}
.day-meta{display:flex;gap:4px 14px;flex-wrap:wrap;align-items:baseline;font-size:13px;color:var(--ink-2)}
.day-meta .k{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--c,var(--ink));line-height:1;letter-spacing:-.04em}
.day-meta .k small{font-size:13px;color:var(--ink-3);margin-left:3px;letter-spacing:0;font-weight:500}
.day-meta .pace{font-family:var(--mono);color:var(--ink);font-size:13px;background:var(--s2);padding:2px 8px;border-radius:6px}
.det{font-size:15px;color:var(--ink-2);max-width:62ch}
.ctrl{display:grid;gap:12px}
.log{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:12px;border-top:1px solid var(--line)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line-2);border-radius:12px;padding:3px;gap:2px}
.seg button{appearance:none;border:0;background:transparent;padding:6px 12px;font-size:14px;font-weight:500;color:var(--ink-3);cursor:pointer;border-radius:9px}
.seg button:hover{color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:rgba(var(--sec-rgb),.18);color:var(--sec)}
.seg button[aria-pressed="true"][data-v="sim"]{background:var(--mint);color:#062016}
.seg button[aria-pressed="true"][data-v="parcial"]{background:var(--gold);color:#221805}
.seg button[aria-pressed="true"][data-v="nao"]{background:var(--s3);color:var(--ink)}
.fld{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.fld input{width:74px;padding:8px 10px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg);font-family:var(--mono);font-size:16px}
input:focus{border-color:var(--sec)!important;outline:none;box-shadow:0 0 0 3px rgba(var(--sec-rgb),.18)}
input.obs{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--bg);font-size:16px}
input::placeholder{color:#6f6f7b}
.flag{font-size:13px;color:var(--ember);background:rgba(255,143,102,.1);padding:6px 10px;border-radius:10px;justify-self:start}
.flag.ok{color:var(--mint);background:rgba(95,227,180,.1)}

/* ---------- força do dia ---------- */
.fz{display:grid;gap:10px;border:1px solid rgba(184,162,255,.25);background:linear-gradient(180deg,rgba(184,162,255,.12),rgba(184,162,255,.04));border-radius:14px;padding:12px}
.fz.off{border:1px dashed var(--line-2);background:transparent}
.fz-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.fz-t{font-weight:600;font-size:14px;color:var(--violet);display:inline-flex;align-items:center;gap:8px}
.fz-t::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--violet)}
.fz.off .fz-t{color:var(--ink-3)}
.fz.off .fz-t::before{background:var(--rest)}
.fz-done{appearance:none;border:1px solid var(--violet);background:transparent;color:var(--violet);border-radius:10px;padding:5px 12px;font-weight:600;font-size:13px;cursor:pointer}
.fz-done[aria-pressed="true"]{background:var(--violet);color:#160e2e}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{appearance:none;border:1px solid var(--line-2);background:var(--bg);border-radius:10px;padding:6px 11px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.opt:hover{border-color:rgba(184,162,255,.5)}
.opt em{font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.opt[aria-pressed="true"]{border-color:var(--violet);color:var(--ink);background:rgba(184,162,255,.16)}
.opt[aria-pressed="true"] em{color:var(--violet)}
.opt.used:not([aria-pressed="true"]){opacity:.45}
.fz-hint{font-size:13px;color:var(--ink-2)}
.fz-hint.warn{color:var(--ember)}
.fz-link{font-size:13px;color:var(--violet);cursor:pointer;justify-self:start}

/* ---------- sono ---------- */
.sleep{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sl{appearance:none;border:1px solid var(--line-2);background:var(--bg);border-radius:12px;padding:10px 2px;font-family:var(--mono);font-size:14px;color:var(--ink-2);cursor:pointer}
.sl:hover{border-color:rgba(154,164,255,.5)}
.sl[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#0f1230;font-weight:600}
.sl.low[aria-pressed="true"]{background:var(--ember);border-color:var(--ember);color:#1f0b04}

/* ---------- água ---------- */
.water{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.ring{position:relative;width:104px;height:104px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:rgba(98,211,247,.14);fill:none;stroke-width:8}
.ring .val{stroke:url(#wgrad);fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px rgba(98,211,247,.45))}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-family:var(--mono);font-weight:600;font-size:18px;line-height:1;color:var(--cyan)}
.ring .c span{font-size:11px;color:var(--ink-3);margin-top:4px}
.water.big .ring{width:176px;height:176px}
.water.big .ring .c b{font-size:32px}
.w-side{display:grid;gap:10px;min-width:0}
.w-meta{font-size:14px;color:var(--ink-2)}
.w-meta b{color:var(--cyan);font-family:var(--mono);font-weight:600}
.w-btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:300px}
.wb{appearance:none;border:1px solid rgba(98,211,247,.4);background:rgba(98,211,247,.12);color:var(--cyan);border-radius:12px;padding:8px 4px;font-family:var(--mono);font-weight:600;font-size:15px;cursor:pointer;line-height:1.2;text-align:center}
.wb:hover{background:rgba(98,211,247,.2)}
.wb small{display:block;font-family:var(--f);font-weight:500;font-size:11px;color:var(--ink-2);margin-top:2px}
.wb.minus{border-color:var(--line-2);background:var(--bg);color:var(--ink-3)}
.wb.minus small{color:var(--ink-3)}
.w-ok{font-size:14px;color:var(--mint);font-weight:500}
.hist{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;align-items:end;height:150px;position:relative;padding-top:6px}
.hist .goal-line{position:absolute;left:0;right:0;border-top:1px dashed rgba(98,211,247,.45)}
.hb{appearance:none;border:0;background:none;padding:0;height:100%;display:grid;grid-template-rows:1fr auto;gap:5px;cursor:pointer}
.hb .col{align-self:end;background:linear-gradient(180deg,#7fe0ff,#3a9fd6);border-radius:4px 4px 2px 2px;min-height:3px}
.hb.miss .col{background:linear-gradient(180deg,rgba(98,211,247,.45),rgba(98,211,247,.18))}
.hb span{font-family:var(--mono);font-size:10px;color:var(--ink-3);text-align:center}
.hb[aria-pressed="true"] span{color:var(--cyan);font-weight:600}
.hb[aria-pressed="true"] .col{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--cyan)}
.segw{display:grid;gap:8px}
.segw label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan)}
.hint{font-size:13px;color:var(--ink-3)}

/* ---------- plano ---------- */
.planhero{position:relative;padding:22px;border:1px solid transparent;background:linear-gradient(var(--s1),var(--s1)) padding-box,linear-gradient(135deg,rgba(244,203,110,.7),rgba(244,203,110,.1) 40%,rgba(255,143,102,.5)) border-box;overflow:hidden}
.planhero::after{content:"";position:absolute;right:-80px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(244,203,110,.16),transparent 70%);pointer-events:none}
.planhero .ph-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative}
.planhero .eyebrow{color:var(--gold)}
.bigd{font-family:var(--mono);font-weight:600;font-size:clamp(60px,16vw,88px);line-height:.9;letter-spacing:-.06em;margin-top:10px;background:linear-gradient(180deg,#fff,#d8d8e0);-webkit-background-clip:text;background-clip:text;color:transparent}
.bigd small{font-size:.26em;letter-spacing:0;margin-left:6px;-webkit-text-fill-color:var(--gold)}
.planhero h2{font-size:14px;font-weight:500;color:var(--ink-2);margin-top:12px;font-family:var(--mono)}
.ph-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:18px;border-top:1px solid var(--line);padding-top:14px;position:relative}
.ph-row div+div{border-left:1px solid var(--line);padding-left:12px}
.ph-row span{display:block;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.ph-row b{font-family:var(--mono);font-weight:600;font-size:15px}
.road-grid{display:grid;gap:3px;row-gap:6px}
.ph-lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding-bottom:6px;border-bottom:2px solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-lbl.base{color:var(--mint);border-color:var(--mint)}.ph-lbl.vo2{color:var(--ember);border-color:var(--ember)}.ph-lbl.esp{color:var(--blue);border-color:var(--blue)}.ph-lbl.taper{color:var(--gold);border-color:var(--gold)}
.wcell{appearance:none;border:0;cursor:pointer;height:32px;border-radius:7px;position:relative;font-family:var(--mono);font-size:11px;font-weight:600;padding:0;overflow:hidden;color:var(--c);background:rgba(var(--rgb),.14)}
.wcell.base{--c:var(--mint);--rgb:95,227,180}.wcell.vo2{--c:var(--ember);--rgb:255,143,102}.wcell.esp{--c:var(--blue);--rgb:134,182,255}.wcell.taper{--c:var(--gold);--rgb:244,203,110}
.wcell i{position:absolute;left:0;bottom:0;height:100%;width:0;background:rgba(var(--rgb),.35)}
.wcell span{position:relative}
.wcell.cut{background:transparent;box-shadow:inset 0 0 0 1px rgba(var(--rgb),.4)}
.wcell.now{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink);color:var(--ink)}
.mile{font-size:10px;color:var(--ink-3);text-align:center;white-space:nowrap;justify-self:center;font-family:var(--mono);font-weight:600}
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.goal{display:grid;gap:2px;align-content:start}
.goal .gk{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.goal b{font-family:var(--mono);font-weight:600;font-size:22px;line-height:1.2;letter-spacing:-.03em}
.goal small{font-size:12px;color:var(--ink-3)}
.gbar{height:4px;border-radius:4px;background:rgba(var(--rgb),.15);overflow:hidden;margin-top:10px}
.gbar i{display:block;height:100%;width:0;background:var(--c);border-radius:4px;transition:width .6s}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none;flex:0 0 auto;border:1px solid var(--line);background:var(--s1);border-radius:12px;padding:7px 11px 6px;cursor:pointer;text-align:left;min-width:58px;position:relative}
.chip b{display:block;font-family:var(--mono);font-size:14px;font-weight:600;line-height:1.2}
.chip span{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.chip .dot{position:absolute;top:10px;right:9px;width:6px;height:6px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:rgba(244,203,110,.6);background:rgba(244,203,110,.14);color:var(--gold)}
.chip[aria-pressed="true"] span{color:var(--gold);opacity:.75}
.chip.now::after{content:"";position:absolute;left:50%;bottom:-7px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ember)}
.wk{overflow:hidden;padding:0}
.wk-band{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:18px 16px 10px;background:linear-gradient(180deg,rgba(var(--rgb),.16),rgba(var(--rgb),0));border-top:3px solid var(--c)}
.wk-id{display:flex;align-items:flex-end;gap:12px}
.wk-n{font-family:var(--mono);font-weight:600;font-size:40px;line-height:.85;letter-spacing:-.06em;color:var(--c)}
.wk-eye{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.wk-band h3{font-family:var(--mono);font-weight:500;font-size:15px;line-height:1.3;color:var(--ink-2);letter-spacing:-.02em}
.wk-band .meta{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.wk-band .meta b{color:var(--ink);font-weight:600}
.wk-note{padding:0 16px 14px;color:var(--ink-2);font-size:14px;border-bottom:1px solid var(--line)}
.wk-nav{display:flex;justify-content:space-between;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.day{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;padding:14px 16px 14px 12px;border-bottom:1px solid var(--line);position:relative}
.day::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--c,transparent)}
.day:last-of-type{border-bottom:0}
.day.t-facil{--c:var(--mint)}.day.t-longao{--c:var(--blue)}.day.t-qual,.day.t-ativ{--c:var(--ember)}.day.t-forca{--c:var(--violet)}.day.t-prova{--c:var(--gold)}.day.t-desc{--c:transparent}
.day.is-today{background:rgba(255,143,102,.06)}
.day-date{padding-top:1px}
.day-date b{display:block;font-size:14px;font-weight:600}
.day-date span{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.day.is-today .day-date span{color:var(--ember);font-weight:600}
.day-main{display:grid;gap:8px;min-width:0}
.day .day-head h4{font-size:16px}
.day .day-meta .k{font-size:19px}
.day:not(.open) .det,.day:not(.open) .ctrl{display:none}
.day.rest .day-head h4{color:var(--ink-3);font-weight:500}
.dsum{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dsum span{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.dsum span.ok{color:var(--mint)}
.expand{appearance:none;border:1px solid var(--line-2);background:var(--s2);color:var(--ink-2);border-radius:10px;padding:5px 11px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.day.open .expand{background:transparent;border-color:transparent;color:var(--ink-3)}

/* ---------- gerador ---------- */
.dists{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dist{appearance:none;border:1px solid var(--line-2);background:var(--bg);border-radius:14px;padding:12px 2px 10px;cursor:pointer;text-align:center;display:grid;gap:3px}
.dist b{font-family:var(--mono);font-weight:600;font-size:17px;line-height:1}
.dist span{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.dist[aria-pressed="true"]{background:linear-gradient(135deg,#ff7a4a,#ffac5f);border-color:transparent;color:#1b0c05;box-shadow:0 8px 22px rgba(255,122,74,.28)}
.dist[aria-pressed="true"] span{color:#3d1c0c}
.form{display:grid;gap:20px}
.frow{display:grid;gap:8px}
.frow .lbl{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.frow .lbl b{font-family:var(--mono);font-size:14px;letter-spacing:-.02em;color:var(--ink);text-transform:none;font-weight:600}
.tin{width:100%;padding:11px 13px;border:1px solid var(--line-2);border-radius:12px;background:var(--bg);font-family:var(--mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
input[type="date"].tin{font-size:16px;color-scheme:dark}
input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;cursor:pointer}
input[type="range"]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--ember) var(--p,50%),var(--s3) var(--p,50%))}
input[type="range"]::-moz-range-track{height:4px;border-radius:4px;background:var(--s3)}
input[type="range"]::-moz-range-progress{height:4px;border-radius:4px;background:var(--ember)}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;margin-top:-8px;box-shadow:0 0 0 4px rgba(255,143,102,.3),0 2px 6px rgba(0,0,0,.5)}
input[type="range"]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:0}
.prev-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pt{background:rgba(var(--rgb),.09);border:1px solid rgba(var(--rgb),.2);border-radius:12px;padding:9px 10px}
.pt span{display:block;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.pt b{font-family:var(--mono);font-weight:600;font-size:18px;letter-spacing:-.03em}
.pt small{display:block;font-size:11px;color:var(--ink-3)}
.vbars{display:flex;align-items:flex-end;gap:3px;height:96px;margin-top:16px}
.vbars div{flex:1 1 0;border-radius:3px 3px 1px 1px;min-height:3px}
.vbars .base{background:var(--mint)}.vbars .vo2{background:var(--ember)}.vbars .esp{background:var(--blue)}.vbars .taper,.vbars .race{background:var(--gold)}.vbars .rec{background:var(--rest)}.vbars .cut{opacity:.45}
.vlbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:6px}
.stick{position:sticky;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:3}

/* ---------- tabelas e listas ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--s1)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{color:var(--sec);font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:12px 10px;white-space:nowrap;border-bottom:1px solid var(--line);background:rgba(var(--sec-rgb),.06)}
td{padding:10px;border-top:1px solid var(--line);text-align:center;vertical-align:middle;font-family:var(--mono);font-size:13px}
td.l,th.l{text-align:left}
td.l{font-family:var(--f)}
td.nw{white-space:nowrap}
tr.cur td{background:rgba(255,143,102,.07)}
tr.race td{background:rgba(244,203,110,.07)}
#t-sum{min-width:580px}#t-eff{min-width:560px}
.inputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.in{display:grid;gap:6px;align-content:start}
.in label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.in small{font-size:12px;color:var(--ink-3)}
.in small.err{color:var(--warn)}
.outs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.out span{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--c,var(--ink-3))}
.out b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.2;margin-top:4px;letter-spacing:-.03em}
.out small{font-size:12px;color:var(--ink-3)}
.zones{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.zone{padding:12px 2px;text-align:center;border-radius:12px;background:rgba(var(--zr),.12);border:1px solid rgba(var(--zr),.28)}
.zone b{display:block;font-size:13px;font-weight:600;color:rgb(var(--zr))}
.zone span{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.zone:nth-child(1){--zr:139,139,152}.zone:nth-child(2){--zr:134,182,255}.zone:nth-child(3){--zr:95,227,180}.zone:nth-child(4){--zr:255,143,102}.zone:nth-child(5){--zr:255,110,110}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap;margin-bottom:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.g-grid{stroke:var(--line);stroke-width:1}
.g-lbl{fill:var(--ink-3);font-size:10px;font-family:var(--mono)}
.g-lbl.cur{fill:var(--ember);font-weight:600}
.g-plan{fill:var(--s3)}.g-real{fill:var(--mint)}.g-over{fill:var(--ember)}.g-cur{fill:rgba(255,143,102,.07)}
.tag{display:inline-block;font-family:var(--f);font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;color:var(--ink-3)}
.tag.ok{color:var(--mint);background:rgba(95,227,180,.12)}.tag.warn{color:var(--ember);background:rgba(255,143,102,.12)}.tag.low{color:var(--ink-2);background:var(--s2)}
.toggle{display:flex;align-items:center;gap:14px}
.sw{appearance:none;width:48px;height:28px;border-radius:99px;background:var(--s3);position:relative;cursor:pointer;border:0;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink-2);transition:left .2s,background .2s}
.sw[aria-checked="true"]{background:var(--violet)}
.sw[aria-checked="true"]::after{left:23px;background:#fff}
.wkf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wkf div{border:1px solid var(--line-2);background:var(--bg);border-radius:14px;padding:10px 12px}
.wkf b{display:block;font-family:var(--mono);font-weight:600;font-size:22px;color:var(--ink-3)}
.wkf span{font-size:12px;color:var(--ink-3)}
.wkf .pl b{color:var(--violet)}
.wkf .ok{border-color:var(--violet);background:rgba(184,162,255,.14)}
.wkf .ok b{color:var(--violet)}
.wkf .ok span{color:var(--ink-2)}
.sess{padding:0;overflow:hidden}
.sess-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:16px;background:linear-gradient(180deg,rgba(184,162,255,.14),rgba(184,162,255,0));border-top:3px solid var(--violet)}
.sess-h h3{font-size:17px}
.sess-h h3 .lt{font-family:var(--mono);color:var(--violet);margin-right:10px;font-weight:600}
.sess-h span{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.ex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.ex h4{font-size:15px;font-weight:500;letter-spacing:-.01em}
.ex .note{font-size:13px;color:var(--ink-3)}
.ex .rx{grid-column:1 / -1;font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.ex .rx b{font-weight:600;color:var(--violet);font-size:13px}
.ex .kind{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-left:8px}
.lib{display:grid;gap:12px}
.vo{display:grid;gap:6px;align-content:start}
.vo h3{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.vo .str{font-size:17px;font-weight:600;line-height:1.25;letter-spacing:-.02em}
.vo .pace{font-family:var(--mono);font-size:13px;color:var(--c);font-weight:600}
.vo dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:6px 0 0;font-size:13px}
.vo dt{color:var(--ink-3)}.vo dd{margin:0;color:var(--ink-2)}
.wlink{appearance:none;border:0;background:rgba(var(--rgb,255,143,102),.12);padding:1px 7px;border-radius:6px;color:var(--c,var(--ember));font-family:var(--mono);cursor:pointer;font-size:12px;font-weight:600}
.tests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.menu{padding:0;overflow:hidden}
.mi{appearance:none;width:100%;border:0;background:none;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 16px;text-align:left;cursor:pointer;border-top:1px solid var(--line)}
.mi:first-child{border-top:0}
.mi:hover{background:var(--s2)}
.mi:active{transform:none}
.mi .ic{width:40px;height:40px;border-radius:12px;display:grid;place-content:center;background:rgba(var(--rgb),.14);border:1px solid rgba(var(--rgb),.25)}
.mi svg{width:20px;height:20px;stroke:var(--c);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mi b{display:block;font-weight:600;font-size:15px;color:var(--ink)}
.mi span{font-size:13px;color:var(--ink-3)}
.mi i{font-style:normal;color:var(--ink-3)}
.sci{display:grid;gap:8px;scroll-margin-top:16px}
.sci .eyebrow{color:var(--gold);font-family:var(--mono);letter-spacing:.02em;text-transform:none;font-size:12px}
.sci h3{font-size:17px}
.sci .find{color:var(--ink-2);font-size:15px}
.sci .use{font-size:14px;color:var(--ink);padding:8px 12px;border-radius:10px;background:rgba(255,143,102,.08);border-left:3px solid var(--ember)}
.sci .cite{font-size:12px;color:var(--ink-3)}
.sci.hl{border-color:rgba(244,203,110,.6);box-shadow:0 0 0 1px rgba(244,203,110,.4)}
ol.rules,ul.rules{margin:0;padding-left:20px;display:grid;gap:8px;color:var(--ink-2);font-size:15px}
ol.rules li::marker,ul.rules li::marker{color:var(--sec)}
.install{display:grid;gap:6px}
.install ol{margin:4px 0;padding-left:20px;display:grid;gap:4px;color:var(--ink-2);font-size:15px}

/* ---------- barra inferior ---------- */
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;width:min(430px,calc(100% - 28px));background:rgba(26,26,32,.86);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--line-2);border-radius:22px;box-shadow:0 14px 36px rgba(0,0,0,.55)}
.bnav-in{display:grid;grid-template-columns:repeat(5,1fr);padding:5px}
.nb{appearance:none;border:0;background:none;display:grid;justify-items:center;gap:3px;padding:8px 2px 6px;font-size:10.5px;font-weight:600;color:var(--ink-3);cursor:pointer;border-radius:16px}
.nb svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nb:hover{color:var(--ink-2)}
.nb[aria-selected="true"]{color:var(--nc);background:rgba(var(--nr),.15)}
.nb[data-nav="hoje"]{--nc:var(--ember);--nr:255,143,102}.nb[data-nav="plano"]{--nc:var(--gold);--nr:244,203,110}.nb[data-nav="agua"]{--nc:var(--cyan);--nr:98,211,247}.nb[data-nav="forca"]{--nc:var(--violet);--nr:184,162,255}.nb[data-nav="mais"]{--nc:var(--ink);--nr:184,184,196}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--s3);border:1px solid var(--line-2);color:var(--ink);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:20;max-width:calc(100% - 32px);animation:in .18s ease both}

@media (min-width:700px){.lib{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){
  .rsvg{width:104px;height:104px}
  .rings{gap:14px}
  .ph-row{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:12px}
  .ph-row div:nth-child(3){border-left:0;padding-left:0}
  .water.big{grid-template-columns:1fr;justify-items:center;text-align:center}
  .water.big .w-btns{justify-content:center;margin-inline:auto;width:100%}
  .prev-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:360px){.water{grid-template-columns:1fr;justify-items:center}.rings{grid-template-columns:1fr;justify-items:center}.inputs{grid-template-columns:1fr}}

/* ---------- coach adaptativo + leitura de print ---------- */
.adj{display:grid;gap:4px;padding:10px 12px;border-radius:12px;background:rgba(255,143,102,.08);border:1px solid rgba(255,143,102,.26);border-left:3px solid var(--ember)}
.adj b{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ember)}
.adj p{font-size:14px;color:var(--ink-2)}
.adj .refs:empty{display:none}
.day:not(.open) .adj p,.day:not(.open) .adj .refs{display:none}
.day:not(.open) .adj{padding:5px 10px}
.day-meta s{font-family:var(--mono);font-size:13px;color:var(--ink-3);text-decoration-thickness:1.5px}
.ref.tag{border-color:var(--line-2);background:var(--s2);color:var(--ink-3);cursor:default}
.dor{appearance:none;width:100%;margin-top:10px;padding:10px 12px;border-radius:12px;border:1px dashed var(--line-2);background:transparent;color:var(--ink-2);font-size:14px;font-weight:500;cursor:pointer}
.dor[aria-pressed="true"]{border-style:solid;border-color:rgba(255,143,102,.5);background:rgba(255,143,102,.12);color:var(--ember)}
.how{display:grid;gap:10px}
.how ol{margin:0;padding-left:20px;display:grid;gap:10px;color:var(--ink-2);font-size:15px}
.how li b{color:var(--ink);font-weight:600}
.how li::marker{color:var(--ember);font-family:var(--mono)}
.how .ref{margin-top:4px}

/* ---------- registro manual + exercícios do dia ---------- */
.mf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex-basis:100%;min-width:0}
.mf label{display:grid;gap:3px;font-size:11px;font-weight:500;color:var(--ink-3);min-width:0}
.mf label span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mf input{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg);font-family:var(--mono);font-size:16px;color:var(--ink)}

  if(prev>=8&&cur>prev*1.3&&(cur>planKm(a,end)+1||prev<planKm(pa,pb)*.8))o.over={pct:Math.round((cur/prev-1)*100),a:cur,b:prev};
  var ez=[];for(i=0;i<10;i++){d=iso(addDays(end,-i));f=IDX[d];l=logs[d];if(!f||!(f.x.t==="facil"||f.x.t==="longao")||!runDone(l)||!(l.fc>0||l.zones))continue;ez.push(l.fc>z.z2||zHigh(l)>=50);}
  var nh=ez.filter(Boolean).length;if(nh>=2&&(ez[0]||ez[1]))o.hr={n:nh};
  var nm=0;for(i=0;i<7;i++){d=iso(addDays(end,-i));f=IDX[d];l=logs[d];if(f&&f.x.km&&!f.x.race&&l&&l.s==="nao")nm++;}if(nm>=2)o.miss={n:nm};
  for(i=0;i<10;i++){d=iso(addDays(end,-i));f=IDX[d];if(f&&f.x.t==="longao"){l=logs[d];if(runDone(l)&&l.km>0&&l.km<f.x.km*.8)o.long={done:+l.km,plan:f.x.km,d:d};break;}}

}

function draftInit(){draft=JSON.parse(JSON.stringify(cfg.plan));draft.mode=draft.mode||"start";draft.race=draft.race||iso(dateOfP(draft.start,draft.weeks,6));}
function applyDraftDates(){
  var d=DIST[draft.dist];
  if(draft.mode==="race"){var r=parseISO(draft.race);if(!r)return;if(dowIdx(r)!==6)r=addDays(r,6-dowIdx(r));draft.race=iso(r);
    var nm=nextMonday(parseISO(todayISO())),avail=Math.floor((daysBetween(nm,r)+1)/7);draft.weeks=clamp(Math.min(avail,d.max),4,d.max);
    draft.start=iso(addDays(r,-(draft.weeks-1)*7-6));}
  else{draft.weeks=clamp(draft.weeks,4,d.max);draft.race=iso(dateOfP(draft.start,draft.weeks,6));}
}
function analyze(P,plan){
  var d=DIST[P.dist],out=[],pred=riegel(cfg.t5k,5,d.km);
  if(P.goal){var diff=(P.goal-pred)/pred;
    if(diff<-0.03)out.push({lv:"warn",ic:"🎯",t:"Meta ambiciosa",p:"Seu 5 km atual projeta "+fmtTime(pred)+". A meta pede "+Math.round(-diff*100)+"% a mais. Os testes de 5 km vão dizer se dá.",r:["riegel"]});
    else if(diff>0.06)out.push({lv:"info",ic:"🎯",t:"Meta folgada",p:"Seu 5 km projeta "+fmtTime(pred)+". Dá para mirar mais rápido depois do primeiro teste.",r:["riegel"]});
    else out.push({lv:"ok",ic:"🎯",t:"Meta realista",p:"Seu 5 km atual projeta "+fmtTime(pred)+", perto da meta.",r:["riegel"]});}
  else out.push({lv:"ok",ic:"🏁",t:"Objetivo: completar",p:"Previsão pelo seu 5 km: "+fmtTime(pred)+" ("+fmtPace(pred/d.km)+"/km). O ritmo de prova usa essa previsão.",r:["riegel"]});
  if(P.dist==="42")out.push({lv:"info",ic:"⚠️",t:"Previsão de maratona costuma sair otimista",p:"A fórmula funciona melhor até cerca de 4 h de esforço. Use os longões para calibrar.",r:["riegel"]});
  if(P.weeks<d.min)out.push({lv:"warn",ic:"⏳",t:"Pouco tempo: "+P.weeks+" semanas",p:"O recomendado para "+d.label+" é por volta de "+d.weeks+". O plano comprime as fases.",r:[]});
  var vmax=0,lmax=0;plan.forEach(function(w){if(w.kind!=="race")vmax=Math.max(vmax,w.V);w.days.forEach(function(x){if(x.t==="longao")lmax=Math.max(lmax,x.km);});});
  if(vmax>P.baseKm*1.6)out.push({lv:"warn",ic:"📈",t:"Volume quase dobra",p:"De "+fmtKm(P.baseKm)+" para "+fmtKm(vmax)+" km/semana. O gerador sobe no máximo ~8% por semana de carga, com semana leve a cada 4.",r:["nielsen","buist"]});
  else out.push({lv:"ok",ic:"📈",t:"Progressão segura",p:"De "+fmtKm(P.baseKm)+" para "+fmtKm(vmax)+" km/semana, com semana leve a cada 4.",r:["nielsen"]});
  if(lmax<d.longPeak)out.push({lv:"info",ic:"⛰",t:"Longão chega a "+fmtKm(lmax)+" km",p:"O ideal para "+d.label+" seria "+d.longPeak+" km. Mais semanas ou maior distância recente ajudam.",r:[]});
  if(P.dist==="42"&&lmax>vmax*.5)out.push({lv:"warn",ic:"⚖️",t:"Longão pesa mais da metade da semana",p:"Para maratona, 5 dias de corrida ou mais volume de base deixam o longão mais seguro.",r:[]});
  out.push({lv:"ok",ic:"🪶",t:"Polimento de 2 semanas",p:"Volume cai e a intensidade fica, como manda a meta-análise.",r:["bosquet"]});
  return out;
}

    '<li><b>Longão curto</b>: fez menos de 80% do previsto, o próximo fica no máximo 1,5 km acima do que você fez. '+tagsHTML(["prática de treinador"])+'</li>'+
    '<li><b>2 corridas perdidas</b> em 7 dias: o próximo longão não sobe. Treino perdido não se compensa. '+tagsHTML(["prática de treinador"])+'</li></ol>'+
    '<p class="hint">Os números vêm do que você registra no app. O que o app não vê (dor antiga, viagem, estresse, calor fora do normal), me conte no chat.</p></div>';

  h+=SCI.map(function(s){return '<div class="card sci'+(sciFocus===s.id?" hl":"")+'" id="sci-'+s.id+'"><span class="eyebrow">'+SCIS[s.id]+"</span><h3>"+esc(s.t)+'</h3><p class="find">'+esc(s.f)+'</p><p class="use"><b>No app:</b> '+esc(s.u)+'</p><p class="cite">'+esc(s.c)+' <a href="'+s.url+'" target="_blank" rel="noopener">abrir ›</a></p></div>';}).join("");
  h+='<p class="muted">Duração das fases, longão de pico e o encaixe da musculação na sua semana são decisões de treinador, não de estudo.</p>';
  $("app").innerHTML='<div class="panel view">'+h+"</div>";
  if(sciFocus){var el=$("sci-"+sciFocus);if(el)setTimeout(function(){el.scrollIntoView({block:"center"});},30);}
}



/* ====================== NAVEGAÇÃO ====================== */
var VIEWS={hoje:vHoje,plano:vPlano,agua:vAgua,forca:vForca,mais:vMais,planos:vPlanos,ritmos:vRitmos,vo2max:vVo2,resumo:vResumo,ciencia:vCiencia};
var NAVOF={planos:"mais",ritmos:"mais",vo2max:"mais",resumo:"mais",ciencia:"mais"};
function show(v,keep){if(!VIEWS[v])v="hoje";document.body.dataset.sec=v;if(v==="planos"&&view!=="planos")draft=null;view=v;var nav=NAVOF[v]||v;$$(".nb").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.nav===nav));});VIEWS[v]();try{history.replaceState(null,"","#"+v);}catch(e){}if(!keep)window.scrollTo(0,0);}
function refresh(){var a=document.activeElement;if(a&&a.tagName==="INPUT"&&$("app").contains(a)&&view!=="planos"){syncInputs($("app"));syncCargas();return;}if(view==="planos")return;var y=window.scrollY;VIEWS[view]();window.scrollTo(0,y);}

/* ====================== EVENTOS ====================== */
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act],[data-go],[data-nav],[data-week],[data-day],[data-adate],[data-sci]");if(!el||el.disabled)return;
  if(el.dataset.nav){show(el.dataset.nav);return;}
  if(el.dataset.sci){sciFocus=el.dataset.sci;show("ciencia");return;}
  if(el.dataset.go){ev.preventDefault();sciFocus=null;show(el.dataset.go);return;}
  if(el.dataset.week!=null){var n=+el.dataset.week;if(n<0||n>lastN())return;curWeek=n;if(view!=="plano"){show("plano");}else{var y=window.scrollY;vPlano();window.scrollTo(0,y);}
    if(!el.dataset.stay){var wk=$("week");if(wk)window.scrollTo({top:wk.getBoundingClientRect().top+window.scrollY-16,behavior:"smooth"});}return;}
  if(el.dataset.day!=null){var k=+el.dataset.day;viewDate=k===0?todayISO():iso(addDays(parseISO(viewDate||todayISO()),k));show("hoje");return;}
  if(el.dataset.adate){aguaDate=el.dataset.adate;vAgua();return;}
  var act=el.dataset.act,di=el.dataset.slot;
  if(act==="agua"){var dd=el.dataset.date,v=+el.dataset.v,m=aguaMeta(dd),before=agua[dd]||0;agua[dd]=Math.max(0,before+v);saveAgua(dd);refresh();if(v>0&&agua[dd]>=m.total&&before<m.total)toast("Meta de água batida");return;}
  if(act==="cfg"){cfg[el.dataset.k]=el.dataset.v;saveCfg();refresh();return;}
  if(act==="gym"){cfg.gym=!cfg.gym;saveCfg();refresh();return;}
  if(act==="dd"){draft.dist=el.dataset.v;var dx=DIST[draft.dist];draft.weeks=dx.weeks;if(draft.goal){draft.goal=Math.round(riegel(cfg.t5k,5,dx.km)/60)*60;}vPlanos();return;}
  if(act==="dg"){draft.goal=el.dataset.v==="time"?Math.round(riegel(cfg.t5k,5,DIST[draft.dist].km)/60)*60:null;vPlanos();return;}
  if(act==="dm"){draft.mode=el.dataset.v;vPlanos();return;}
  if(act==="dr"){draft.runDays=+el.dataset.v;vPlanos();return;}
  if(act==="export"){doExport();return;}
  if(act==="activate"){applyDraftDates();var p={dist:draft.dist,goal:draft.goal||null,weeks:draft.weeks,start:draft.start,runDays:draft.runDays,baseKm:draft.baseKm,longest:draft.longest};cfg.plan=p;saveCfg();rebuild();draft=null;toast("Plano de "+DIST[p.dist].label.toLowerCase()+" ativado");show("plano");return;}
  if(act==="open"){openDays[di]=!isOpen(di);var yy=window.scrollY;vPlano();window.scrollTo(0,yy);return;}
  if(!di)return;var l=logs[di]=logs[di]||{},f=IDX[di];
  if(act==="dor"){l.dor=!l.dor;saveLog(di);refresh();toast(l.dor?"Anotado: 3 dias sem intensidade":"Dor ou mal-estar desmarcado");return;}
  if(act==="sleep"){var sv=+el.dataset.v;l.sleep=l.sleep===sv?null:sv;saveLog(di);refresh();return;}
  if(!f)return;
  if(act==="run"){l.s=l.s===el.dataset.v?"":el.dataset.v;if(l.s==="sim"&&!(l.km>0)&&f.x.km&&!f.x.race)l.km=pkm(di,f.x);saveLog(di);refresh();if(l.s==="sim")toast("Corrida registrada ✓");return;}
  if(act==="musc"){var mb=muscPlan(f.w);l.musc=el.dataset.v;if(el.dataset.v==="none")l.fs="";var ma=muscPlan(f.w);var ch=f.w.days.filter(function(y){return y.d>f.x.d&&mb[y.d]&&ma[y.d]&&mb[y.d].eff!==ma[y.d].eff;}).map(function(y){return DOWF[y.d]+" agora é "+(ma[y.d].eff==="none"?"sem musculação":"treino "+ma[y.d].eff);});saveLog(di);refresh();if(ch.length)toast("Semana reencaixada: "+ch.join(", "));return;}
  if(act==="fs"){var mp=muscPlan(f.w)[f.x.d];if(l.fs==="sim")l.fs="";else{l.fs="sim";if(!l.musc&&mp)l.musc=mp.eff;}saveLog(di);refresh();if(l.fs==="sim")toast("Treino "+l.musc+" registrado ✓");return;}
  if(act==="use5k"){var s=parseTime(l.t5k);if(!s||s<900||s>3600){toast("Escreva o tempo como 30:15");return;}cfg.t5k=s;saveCfg();refresh();toast("Ritmos atualizados: 5 km em "+fmtTime(s));return;}
});
document.addEventListener("input",function(ev){
  var t=ev.target,ds=t.dataset||{};
  if(ds.slot){var l=logs[ds.slot]=logs[ds.slot]||{},f=ds.f,raw=String(t.value).trim();
    if(f==="km"||f==="fc"||f==="fcmax"||f==="kcal"){var v=parseFloat(raw.replace(",","."));l[f]=v>0?(f==="km"?Math.round(v*100)/100:Math.round(v)):null;}
    else if(f==="time"||f==="pace"){var sv=parseTime(raw,f==="pace");l[f]=sv>0?sv:null;if(f==="pace")l.paceAuto=false;}
    else if(f==="t5k")l.t5k=raw||null;else l[f]=t.value;
    if(f==="km"||f==="time"){if(l.km>0&&l.time>0&&l.time/l.km<150&&l.time*60/l.km<=900)l.time*=60;
      if(l.km>0&&l.time>0&&(!l.pace||l.paceAuto)){var pc=Math.round(l.time/l.km);if(pc>=150&&pc<=900){l.pace=pc;l.paceAuto=true;}}}
    saveLog(ds.slot);syncInputs($("app"));return;}
  if(ds.ex){var v2=parseFloat(String(t.value).replace(",","."));cargas[ds.ex]=v2>0?v2:null;saveCarga(ds.ex);return;}
  if(ds.ck){var e=$(ds.ck==="t5k"?"e-t5k":"e-fc");
    if(ds.ck==="t5k"){var s=parseTime(t.value);if(!s||s<900||s>3600){e.textContent="Use mm:ss, entre 15:00 e 60:00.";e.className="err";return;}e.textContent="Atualizado.";e.className="";cfg.t5k=s;}
    else{var fv=parseInt(t.value,10);if(!(fv>=150&&fv<=230)){e.textContent="Entre 150 e 230 bpm.";e.className="err";return;}e.textContent="Atualizado.";e.className="";cfg.fcmax=fv;}
    saveCfg();$("outs").innerHTML=outsHTML();$("t-eff").innerHTML=effHTML();return;}
  if(ds.dk&&draft){
    if(t.type==="range"){setRangeFill(t);var val=+t.value;draft[ds.dk]=val;var lab={weeks:"pg-weeks-v",baseKm:"pg-base-v",longest:"pg-long-v"}[ds.dk];if(lab)$(lab).textContent=ds.dk==="weeks"?val:fmtKm(val)+(ds.dk==="baseKm"?" km/sem":" km");}
    else if(ds.dk==="goal"){var g=parseTime(t.value);var dd=DIST[draft.dist];if(!g||g<dd.km*150||g>dd.km*900)return;draft.goal=g;$("pg-goal-h").textContent=fmtPace(g/dd.km)+"/km · previsão pelo seu 5 km: "+fmtTime(riegel(cfg.t5k,5,dd.km));}
    else return;
    applyDraftDates();var plan=buildPlan(draft);$("pg-prev").innerHTML=previewHTML(draft,plan);var btn=document.querySelector('[data-act="activate"]');if(btn)btn.textContent="Ativar plano de "+DIST[draft.dist].label.toLowerCase()+" · "+(plan.length-1)+" semanas";}
});
document.addEventListener("change",function(ev){var t=ev.target,ds=t.dataset||{};if(!ds.dk||!draft)return;
  if(ds.dk==="start"){var d=parseISO(t.value);if(!d)return;if(dowIdx(d)!==0){d=addDays(d,-dowIdx(d));toast("Ajustado para a segunda, "+dm(d));}draft.start=iso(d);vPlanos();}
  else if(ds.dk==="race"){if(!parseISO(t.value))return;draft.race=t.value;vPlanos();}
  else if(t.type==="range"){vPlanos();}});
document.addEventListener("focusout",function(ev){if(ev.target&&ev.target.dataset&&ev.target.dataset.slot){setTimeout(function(){var a=document.activeElement;if(!(a&&a.tagName==="INPUT"))refresh();},60);}});

/* ====================== BACKUP ====================== */
function doExport(){
  var d=new Date(),name="runthistown-backup-"+iso(d)+".json";
  var data=JSON.stringify({app:"RunThisTown",versao:1,exportado:d.toISOString(),cfg:cfg,logs:logs,cargas:cargas,agua:agua},null,1);
  var stamp=dm(d)+"/"+d.getFullYear()+" às "+pad(d.getHours())+":"+pad(d.getMinutes());
  function done(){lsSet("rtt-lastbackup",stamp);var m=$("bk-msg");if(m)m.textContent="Último backup: "+stamp;toast("Backup exportado");}
  try{
    var file=new File([data],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Backup RunThisTown"}).then(done,function(){});return;}
  }catch(e){}
  var url=URL.createObjectURL(new Blob([data],{type:"application/json"})),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);done();
}
document.addEventListener("change",function(ev){
  if(ev.target.id!=="imp")return;var f=ev.target.files&&ev.target.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(o.app!=="RunThisTown"||!o.logs)throw 0;
    cfg=mergeCfg(o.cfg);logs=o.logs||{};cargas=o.cargas||{};agua=o.agua||{};saveLocal();rebuild();toast("Backup importado: "+Object.keys(logs).length+" dias de registro");show("hoje");}
    catch(e){toast("Esse arquivo não é um backup do RunThisTown");}};r.readAsText(f);ev.target.value="";
});

/* ====================== NUVEM ====================== */
function connect(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  window.claude.use("db").then(function(d){
    if(!d)return;db=d;mode="cloud";setStatus("cloud");
    db.doc("config/main").onSnapshot(function(s){if(timers.cfg)return;if(s.exists){cfg=mergeCfg(s.data());rebuild();}saveLocal();refresh();},function(){});
    db.collection("log").onSnapshot(function(q){var next={};q.docs.forEach(function(doc){if(!/^\d{4}-\d{2}-\d{2}$/.test(doc.id))return;var v=doc.data()||{};next[doc.id]={s:v.s||"",km:v.km,fc:v.fc,obs:v.obs||"",t5k:v.t5k||null,musc:v.musc||null,fs:v.fs||"",sleep:v.sleep||null,time:v.time||null,pace:v.pace||null,fcmax:v.fcmax||null,kcal:v.kcal||null,zones:v.zones||null,dor:!!v.dor,src:v.src||""};});
      Object.keys(timers).forEach(function(k){if(k.indexOf("log/")===0){var id=k.slice(4);if(logs[id])next[id]=logs[id];}});logs=next;saveLocal();refresh();},function(){});
    db.collection("cargas").onSnapshot(function(q){var next={};q.docs.forEach(function(doc){var v=doc.data()||{};if(v.kg>0)next[doc.id]=v.kg;});Object.keys(timers).forEach(function(k){if(k.indexOf("carga/")===0){var id=k.slice(6);next[id]=cargas[id];}});cargas=next;saveLocal();syncCargas();},function(){});
    db.collection("agua").onSnapshot(function(q){var next={};q.docs.forEach(function(doc){var v=doc.data()||{};if(v.ml>0)next[doc.id]=v.ml;});Object.keys(timers).forEach(function(k){if(k.indexOf("agua/")===0){var id=k.slice(5);next[id]=agua[id];}});agua=next;saveLocal();if(view==="hoje"||view==="agua")refresh();},function(){});
  },function(){});
}

/* ====================== INÍCIO ====================== */
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
rebuild();
var h0=(location.hash||"").slice(1);
show(VIEWS[h0]?h0:"hoje");
connect();
})();
